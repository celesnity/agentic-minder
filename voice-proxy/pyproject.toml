[project]
name = "voice-proxy"
version = "0.1.0"
description = "Streaming voice proxy server for Spectacles ↔ OpenClaw bridge"
requires-python = ">=3.11"
dependencies = [
    # Server
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",

    # VAD (Silero ONNX — no torch/torchaudio needed)
    "onnxruntime>=1.16.0",
    "numpy>=1.24.0",

    # ASR
    "deepgram-sdk>=3.0.0",

    # TTS
    "cartesia>=1.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "certifi",
]

[project.scripts]
voice-proxy = "server:main"
